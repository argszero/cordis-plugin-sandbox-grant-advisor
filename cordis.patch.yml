# The @argszero/cordis-plugin-sandbox-grant-advisor bundle patch: mount and go.
#
# Twelve reports (#7538, #7622, #7646, #7720, #7750, #7735, #7771, #7804,
# #7816, #8232, #8272, #8275) describe one Windows failure with no way forward:
# the host-side write grant for a sandboxed workspace cannot be applied, so
# every sandboxed command fails before it runs with
#
#   SetNamedSecurityInfoW failed (Win32 5): grantWrite(<workspace>)
#
# The grant is materialized lazily on the first confined call and caches
# nothing when it throws, so the failure repeats per command (850 calls across
# 39 sessions in #7622; 52,588 output tokens with no output in #7538). The
# error names neither the missing right nor a remedy, which is why sessions
# escape into danger-full-access or die on the model's output cap.
#
# This plugin does not repair ACLs. It observes the public
# `tools/post-execute` waterfall, recognizes that signature (and only that
# signature — see the README for what it deliberately refuses to explain), and
# attaches ONE durable user-role advisory per agent through
# `additionalContexts`, so the model gets the diagnosis in the same step as the
# failure:
#
#   - the missing right is WRITE_OWNER on the directory — an object right the
#     caller can grant itself, not SeSecurityPrivilege and not elevation
#     (the manifest half of the merged DACL+SACL write is what needs it);
#   - the directory's own ACL is the discriminator (`icacls <dir>`, looking for
#     an ACE that names your SID with (F));
#   - the remedy is one unelevated line, forked on ownership because one command
#     cannot serve both rights situations — the advisory hands over the check
#     (`(Get-Acl "<dir>").Owner`) rather than guessing:
#       icacls "<dir>" /grant "$env:USERNAME:(OI)(CI)(WO)"
#     with Full control (`F`) offered second as the same line with more than it
#     needs, and an elevated grant for a directory the caller does not own (where
#     `icacls /grant` is itself refused for want of WRITE_DAC);
#   - two version boundaries the error cannot carry: the mandatory label — and
#     with it the SACL — arrives in `0.1.7-alpha.1` (up to `0.1.6-alpha.x` the
#     apply touched the DACL only), and the backend's own
#     `diagnose-windows-sandbox-acl` repair arrives with the `0.2.0` line. Neither
#     makes downgrading a fix, and repairing the `0.1.7` file list is not a thing
#     that can be done — there is nothing in that release to list.
#   - the missing right confirmed from outside (#8426): asking a directory that
#     names the account only through the inherited `Authenticated Users:(M)`
#     entry for a Low mandatory-integrity label is refused unelevated — the label
#     half alone isolates the right the merged call wants — and the identical
#     operation succeeds the moment that account grants itself `(OI)(CI)F`, so the
#     missing right is a right on the directory, not `SeRelabelPrivilege` and not
#     elevation. The same report repaired two trees object-right-first and
#     label-second (9521 and 5592 objects, no failures), the order the advisory's
#     own remedy already follows. The probe is not offered as a check: a label
#     write is not a read.
#
# The advisory also says why a "weaker grant" is not a smaller version of the
# same one, because that is the next idea the diagnosis invites: the label rides
# the SAME SetNamedSecurityInfoW as the DACL (no DACL-only apply path exists), and
# the confined token is itself lowered to Low, so the directory's Low label is
# what lets that child write there at all.
#
# And it says WHAT THE GRANT LEAVES BEHIND once it applies (#8312, #8314, #8412):
# the three entries are STANDING and nothing revokes them (the backend's own dispose
# and fail-closed paths leave them — "the intended end state (the reuse cache)"),
# the Low integrity label is INHERITABLE and lives in the SACL (so `icacls /reset`
# does not remove it — that rebuilds the DACL), a process starts at
# min(user, image) integrity, and an NTFS hard link shares one security descriptor
# with the file object it names — so in a pnpm workspace, whose node_modules are
# hard links into a content-addressed store, the label can reach OUTSIDE the tree
# and stay on the store's objects, after which unrelated builds fail in ways that
# name the build tool and not DSH. The section is stated before the reader runs
# the command, and it ships NO removal command: the maintainers' own diagnosis
# skill reports the label and does not remove it, and removing an integrity label
# needs WRITE_OWNER.
#
# Optional config:
#
#   - set:
#       - id: sandbox-grant-advisor
#         config:
#           # 0 (default) = advisory only: this plugin never blocks a call.
#           # Set it to enable the bounded fail-fast half: once the environment
#           # has failed this way N times, an identical call this plugin has
#           # WATCHED fail is refused before dispatch.
#           enforceAfter: 0
#           maxDenials: 2            # then step aside, so the session can finish
#           exclude: []              # tool-name wildcards never watched
#           href: ''                 # optional URL quoted in the advisory
#
# The advisory half is always on and never blocks anything. The blocking half
# is off by default on purpose: it may only refuse a call it has watched fail in
# this environment, and it is bounded by `maxDenials`, because a plugin that can
# stop command execution must never be the reason a session cannot finish.
#
# A SECOND family is recognized on the same seam (#7638, #8322, #9170): with the
# `minimal` preset and a confining sandbox mode, every shell call dies instantly
# with
#
#   PTY shell exited during startup
#
# The terminal backend cannot create the pseudo-console inside the sandbox, so
# the child exits before its first prompt; retrying never helps and `minimal`
# mounts no fallback shell tool. Inside that combination the HOST BINARY decides
# (#8322, one runner and one ConPTY in every arm): a console-subsystem `node.exe`
# host starts the confined shell, while the packaged desktop's GUI-subsystem
# Electron host kills it silently — the same console rule the third family
# states, where a restricted token can inherit a console but not create one. The
# outcome is deterministic per (session mode x runner host), and the mode that
# counts is the one the session records. That advisory states the resolved mode,
# tells the model to STOP rather than retry, and hands the user the choices — a
# preset swap, a profile-patch row, or a host that owns a console (#8313); it
# never names a command to run (there is no shell to run it in) and never names
# a shell tool the failing composition does not mount. It is sent only when the
# mode the call actually ran under confines; otherwise the failure is left
# untouched and the host log says so once (silence alone would read as "the
# sandbox is not the cause", which this plugin cannot claim). The blocking half
# above deliberately does NOT cover this family: its remedy is a patch-layer
# change the user makes between sessions, not a command that repairs the
# running one.
#
# A THIRD family is recognized from a value, not from text (#7876, #7877,
# #8193, #8208, #8313, #8336, #8334, #8990, #8991, #9186, #9238, #9336):
#
#   [exit code: -1073741502]        (0xC0000142 STATUS_DLL_INIT_FAILED)
#
# A confined Windows child died while its native images were loading, i.e.
# before its entry point. It reaches the tool result as an ordinary nonzero
# exit code — upstream's runner-failure rules admit only exit 127 with the
# `windows-acl-run: ` signature, so this code is never reclassified and never
# arrives as an error — which is why a plugin reading only error results is
# structurally blind to it, and why the model retries a command that cannot
# start. The read is the shell tool's own canonical value
# (`ToolExecutionSuccess.value`, `kind: 'foreground'`), so no line of rendered
# text can be mistaken for it. The advisory states the resolved mode, says the
# process never reached its entry point, enumerates the measured producers
# (an MSYS2 / Git-Bash program that cannot create its signal pipe under the
# restricted token; the sandbox runner hosted by a GUI-subsystem Electron binary
# or spawned without a console — the axis #9238 isolated with a launcher that
# varies only the runner's console topology; and the restricted token's own
# restricting list, where a single capability SID — added only under
# `workspace-write`, so the same command starts fine under `read-only` — kills
# every program, `whoami.exe` and `cmd.exe` included), carries the one conversion
# the model can make itself (rewrite the work as PowerShell or `cmd`), names the
# remedy #8193 measured — a real node.exe host, which the desktop ships — and says
# plainly which producers it does not know. The comparison it hands over is TWO
# STEPS, because the mode switch alone does not name the mechanism: #9336 filed
# the case where the packaged desktop's chain kills every interpreter under
# `workspace-write` and starts them under `read-only`, while the same runner under
# the same argv passes in both modes from a console-bearing chain — so the failing
# combination is a console-less host AND a confining token, and the status code
# still cannot supply the comparison (too few entries in the restricting list land
# on the same `0xC0000142`). A second candidate on the same token is named as a
# candidate and not as a finding: the token's DEFAULT DACL, which
# `setTokenDefaultDaclGrant` extends with a full-access ACE naming
# `tempWriteSid ?? writeSid ?? Everyone`, so `workspace-write` is the only mode
# whose default DACL names a synthetic identity at all. And the advisory says what
# the mode switch costs, because the backend's README does: under `read-only`
# PowerShell enters ConstrainedLanguage, so it is a diagnostic step and not a
# repair. It also states the one rule the whole family
# follows from, because a reader without it reaches for the wrong flag: in a
# restricted token a console can be INHERITED but not CREATED, so a creation
# flag that forces the child to make one of its own — `CREATE_NO_WINDOW`,
# `CREATE_NEW_CONSOLE` — is fatal on its own, while `DETACHED_PROCESS` (which
# declines a console rather than creating one) is not; #8336 measured that
# matrix on one machine, and #8208 measured `windowsHide` both ways on a host
# that works, so the advisory answers that suspicion with where the flag
# actually appears — the ordinary subprocess path, not the confined one — and
# with why a windowless console is still an inheritable console. Like the second
# family, it is mode-gated.
#
# A FOURTH family is the other half of the FIRST one's backend (#423, #8383,
# #8421, #8409). There the grant could not be applied at all; here it WAS applied
# — on the workspace root, once — and Windows ACE inheritance silently skipped the
# objects whose DACL the caller could not write, so commands writing into a
# subdirectory created or moved in from outside (an installer, an editor, another
# harness under its own account) are denied forever while the same command against
# a directory the harness itself created succeeds. The backend's provisioning check
# short-circuits on the root (the grant, the world delete-child deny and the
# exact label must all match before it returns early), so those descendants are
# never revisited. It is read from a value rather than from text, like the third
# family and for the same reason (a denial exits nonzero and the shipped shell
# tools report that as a finished run), but it needs no bespoke code: the
# executors stamp the denial onto the value as
#
#   sandbox: { mode: "workspace-write", denied: true }
#
# produced by matching the backend's own refusal dialect in the captured stderr —
# so this plugin reads the harness's own reading of its own sandbox. It speaks
# only when the host is Windows, the stamped mode is `workspace-write`, and EVERY
# absolute path the command names lies inside the session's workspace: a denial
# anywhere else (outside the workspace, under `read-only`, a runner failure) is
# the sandbox working as designed and is left alone. The advisory prints the path
# it keyed on beside the root it tested it against and says that retrying is
# provably useless — and then, before any check, forks the diagnosis on BREADTH,
# the one fact the reader already owns:
#
#   - a HANDFUL of stubborn objects while the rest of the tree writes normally →
#     the DACL branch (#423: the capability ACE did not arrive at those objects),
#     with the two-sided discriminator that a single check gets wrong — reading
#     and listing use the normal token while writing and deleting use the
#     restricted one, so an object whose DACL names only Administrators/SYSTEM
#     plus the capability SID looks granted to a check that merely greps for the
#     SID;
#   - NOTHING below the root writable at all, the root itself the only writable
#     place → the LABEL branch (#8383, second instance #8421; measured on
#     0.2.0-rc.2 with the decisive control of a directory created after the grant):
#     the DACL is present and inherits correctly at every level while the Low
#     mandatory-integrity label never reaches the children, so the kernel's
#     no-write-up check refuses the Low-integrity child before the ACL is ever
#     consulted — same permanent shape (the label goes out in the same single
#     security-descriptor write as the grant, only on the paths the backend
#     enumerates, with no descendant walk), separable from outside a session by
#     the repository's own `diagnose-windows-sandbox-acl` and its `LOW_LABEL`
#     (`S-1-16-4096`) report;
#   - THE ROOT ITSELF REFUSED, nothing writable, not even the root → a third
#     shape, and the only branch of this family with a recovery inside the product
#     (#8409). The standing grant is gone from the root's own DACL — rewritten
#     from outside the harness — and the layer that would put it back has stopped
#     looking: the session-scoped provider materializes the root ACE once per
#     provider lifetime and consults its own in-memory map afterwards without
#     ever re-reading the DACL, while the agentless/runner path passes no session
#     id, owns the DACLs itself and re-applies the grant on every spawn — which
#     is why that path heals and this one does not. No command reaches it; the
#     move is the user's and it is the provider, not the ACL: restart the desktop
#     app or open the workspace in a fresh one, which empties the map and lets the
#     next provision re-read the DACL and rewrite the missing ACE.
#
# It also states the Windows ceiling that closes the obvious repair (a recursive
# `icacls /grant` for a capability SID is refused with ERROR_NONE_MAPPED (1332),
# because that SID has no name to map; and a manually widened DACL does not clear
# the label half either, because the refusal precedes the ACL). It ships NO
# repair command, for the reason the standing-grant section ships none: this
# project has no Windows host to verify a line on.
#
# A FIFTH family is a pre-spawn refusal with no ACL in it at all (#9175): the
# session's workspace CONTAINS the sandbox's private temp root, and the backend
# refuses to materialize that capability rather than nest a revocable one inside
# a standing one. On Windows the per-user temp root is
# `C:\Users\<you>\AppData\Local\Temp`, so a session opened on the profile
# directory — or any ancestor of it — has every command under `workspace-write`
# refused at once, `echo test` included, with no subprocess output and an error
# that names neither operand to move nor the lever that moves it. The file tools
# keep working: they never spawn the sandbox runner. The invariant is
#
#   assertTempRootOutsideWorkspace(workspaceRoot, tempRoot)
#
# and its own comment gives the reason — "every child created below it would
# inherit the standing workspace capability". The two directories are compared
# CANONICALLY (`realpathSync.native` on both, then `path.relative`), so it is a
# filesystem fact rather than a spelling.
#
# ONE SENTENCE, TWO PRODUCERS, and a fix has to satisfy both: the session-scoped
# provider asserts it while it assembles the runner's argv (no child ever existed
# — which is why the call reports no output at all), and the runner asserts the
# same pair again for `workspace-write` before it spawns (stderr behind
# `windows-acl-run: `, exit 127, reclassified by the seam into a
# `SandboxUnavailableError`). The advisory names which carrier refused. It is read
# from the thrown error's own message — never from rendered output — so a command
# whose own output quotes the sentence is an ordinary success and is left alone.
#
# It ships no repair command, because there is nothing to repair: the refusal
# happens while the sandbox is deciding whether it can set up its own
# capabilities, before any process is created, and no `icacls` grant, no
# elevation and no ownership change affects it. What moves the condition is the
# ENVIRONMENT, and it is the user's move because the failure took command
# execution away — there is no shell left to run a remedy in:
#
#   - point the harness's temp directory outside the workspace before it starts.
#     `os.tmpdir()` on Windows is `GetTempPathW` (`%TMP%`, then `%TEMP%`, then
#     `%USERPROFILE%`), so `set TMP=C:\dsh-temp` — the directory created first,
#     since the check resolves both paths — in the process that LAUNCHES the
#     harness is enough;
#   - or open the session on a workspace that is not an ancestor of the temp root
#     (`C:\work\project` rather than `C:\Users\<you>`).
#
# `read-only` is deliberately unaffected (no private temp capability is
# materialized, so the assertion is never reached) and `danger-full-access` never
# spawns through the sandbox at all, so passing under it is consistency rather
# than a workaround. The advisory says both, because both are the next ideas the
# diagnosis invites.
#
# This is also the plugin's ONLY prediction, and the family's second seat: on
# Windows, before the first tracked call, it asks the public
# `ctx.sandboxPolicy.resolve({ session })` for the mode and the workspace root and
# compares the root against `os.tmpdir()` with the backend's own canonical
# computation, so a `workspace-write` session in the condition is told BEFORE its
# first command fails. The two seats are separate on purpose — if a refusal does
# happen, the producer's line and the carrier that wrote it are facts only the
# failure half can have, and a second advisory follows. The pre-flight prints the
# facts it computed so the claim can be audited, and states the one verification
# available when no command can be run: if a command does run in this session,
# the condition does not apply and the message can be ignored. A Windows host
# that cannot answer at all is disclosed once on the host log rather than passed
# off as clear.

# A SIXTH family is a boundary the harness DOCUMENTS, and the plugin carries it
# anyway because the error does not (#9272, with its neighbours #1157, #4163,
# #997, #1847). Under a confining Windows mode every WMI query and every cmdlet
# built on one is refused with
#
#   0x80041003        (WBEM_E_ACCESS_DENIED)
#
# The restricted token's own lists do not carry the SIDs the WMI namespace
# security check wants, so `Get-CimInstance` fails for any class and takes the
# CIM-backed cmdlets with it — `Get-NetTCPConnection`, `Get-NetIPAddress`,
# `Get-NetAdapter`, `Get-Volume`, `Get-ComputerInfo`. The backend states the
# mechanism itself ("Authenticated Users is absent from both lists — the WMI
# namespace security check fails (`0x80041003`), so CIM cmdlets and
# `Get-ComputerInfo` are unavailable in every confined mode"), and the plugin
# quotes that sentence as the authority rather than presenting a documented
# boundary as a discovery. What it adds is the two things the documentation does
# not supply. First, a measured NATIVE SUBSTITUTE for each command that stops
# working, taken from the report's own measurements on one machine: `netstat -ano`
# for listening ports, `Get-Process`, `Get-Service`,
# `[System.IO.DriveInfo]::new('C').AvailableFreeSpace` for free space,
# `Get-Counter '\Memory\Available MBytes'`, the registry key
# `HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion` for the OS version, and a
# service's own health endpoint rather than a port check — with the two commands
# the report supplies no replacement for (`Get-NetIPAddress`, `Get-NetAdapter`)
# named as gaps rather than filled, since `ipconfig /all` was never measured
# under a confining mode. Second, the two shapes that answer with a WRONG VALUE
# and NO ERROR AT ALL, which is the half that matters to an agent:
# `-ErrorAction SilentlyContinue` turns every refusal here into an empty result
# (read as "nothing is listening"), and `Get-PSDrive` raises nothing while
# reporting `0` for every drive's usage columns, because PowerShell 5.1 fills
# them from a WMI query. The failure is not an infrastructure failure: a cmdlet
# error is a nonzero exit, which the shipped shell tools report without marking
# the result an error, so the code arrives in the settled value's own `stderr`
# and never in `error.message` — the same value-read seam as the third family,
# and like it the family is gated on the platform and on the resolved mode. It
# names no repair: no ACE closes it, no elevation reaches it, and the one narrow
# allowance a reader proposes — read access to `root/cimv2` — is a change to the
# restricted token's own lists, the same absence of Authenticated Users that the
# backend lists as what closes the `C:\`-root tree-creation escape. Nobody has
# measured which of the token's checks refuses the namespace, so the advisory
# declines to price a narrower fix and says so.

- insert:
    - id: sandbox-grant-advisor
      name: '@argszero/cordis-plugin-sandbox-grant-advisor'
