# The @argszero/cordis-plugin-sandbox-grant-advisor bundle patch: mount and go.
#
# Twelve reports (#7538, #7622, #7646, #7720, #7750, #7735, #7771, #7804,
# #7816, #8232, #8272, #8275) describe one Windows failure with no way forward:
# the host-side write grant for a sandboxed workspace cannot be applied, so
# every sandboxed command fails before it runs with
#
#   SetNamedSecurityInfoW failed (Win32 5): grantWrite(<workspace>)
#
# The grant is materialized lazily on the first confined call and caches
# nothing when it throws, so the failure repeats per command (850 calls across
# 39 sessions in #7622; 52,588 output tokens with no output in #7538). The
# error names neither the missing right nor a remedy, which is why sessions
# escape into danger-full-access or die on the model's output cap.
#
# This plugin does not repair ACLs. It observes the public
# `tools/post-execute` waterfall, recognizes that signature (and only that
# signature — see the README for what it deliberately refuses to explain), and
# attaches ONE durable user-role advisory per agent through
# `additionalContexts`, so the model gets the diagnosis in the same step as the
# failure:
#
#   - the missing right is WRITE_OWNER on the directory — an object right the
#     caller can grant itself, not SeSecurityPrivilege and not elevation
#     (the manifest half of the merged DACL+SACL write is what needs it);
#   - the directory's own ACL is the discriminator (`icacls <dir>`, looking for
#     an ACE that names your SID with (F));
#   - the remedy is one unelevated line, forked on ownership because one command
#     cannot serve both rights situations — the advisory hands over the check
#     (`(Get-Acl "<dir>").Owner`) rather than guessing:
#       icacls "<dir>" /grant "$env:USERNAME:(OI)(CI)(WO)"
#     with Full control (`F`) offered second as the same line with more than it
#     needs, and an elevated grant for a directory the caller does not own (where
#     `icacls /grant` is itself refused for want of WRITE_DAC);
#   - two version boundaries the error cannot carry: the mandatory label — and
#     with it the SACL — arrives in `0.1.7-alpha.1` (up to `0.1.6-alpha.x` the
#     apply touched the DACL only), and the backend's own
#     `diagnose-windows-sandbox-acl` repair arrives with the `0.2.0` line. Neither
#     makes downgrading a fix, and repairing the `0.1.7` file list is not a thing
#     that can be done — there is nothing in that release to list.
#
# The advisory also says why a "weaker grant" is not a smaller version of the
# same one, because that is the next idea the diagnosis invites: the label rides
# the SAME SetNamedSecurityInfoW as the DACL (no DACL-only apply path exists), and
# the confined token is itself lowered to Low, so the directory's Low label is
# what lets that child write there at all.
#
# And it says WHAT THE GRANT LEAVES BEHIND once it applies (#8312, #8314): the
# three entries are STANDING and nothing revokes them (the backend's own dispose
# and fail-closed paths leave them — "the intended end state (the reuse cache)"),
# the Low integrity label is INHERITABLE and lives in the SACL (so `icacls /reset`
# does not remove it — that rebuilds the DACL), a process starts at
# min(user, image) integrity, and an NTFS hard link shares one security descriptor
# with the file object it names — so in a pnpm workspace, whose node_modules are
# hard links into a content-addressed store, the label can reach OUTSIDE the tree
# and stay on the store's objects, after which unrelated builds fail in ways that
# name the build tool and not DSH. The section is stated before the reader runs
# the command, and it ships NO removal command: the maintainers' own diagnosis
# skill reports the label and does not remove it, and removing an integrity label
# needs WRITE_OWNER.
#
# Optional config:
#
#   - set:
#       - id: sandbox-grant-advisor
#         config:
#           # 0 (default) = advisory only: this plugin never blocks a call.
#           # Set it to enable the bounded fail-fast half: once the environment
#           # has failed this way N times, an identical call this plugin has
#           # WATCHED fail is refused before dispatch.
#           enforceAfter: 0
#           maxDenials: 2            # then step aside, so the session can finish
#           exclude: []              # tool-name wildcards never watched
#           href: ''                 # optional URL quoted in the advisory
#
# The advisory half is always on and never blocks anything. The blocking half
# is off by default on purpose: it may only refuse a call it has watched fail in
# this environment, and it is bounded by `maxDenials`, because a plugin that can
# stop command execution must never be the reason a session cannot finish.
#
# A SECOND family is recognized on the same seam (#7638, #8322): with the
# `minimal` preset and a confining sandbox mode, every shell call dies instantly
# with
#
#   PTY shell exited during startup
#
# The terminal backend cannot create the pseudo-console inside the sandbox, so
# the child exits before its first prompt; retrying never helps and `minimal`
# mounts no fallback shell tool. Inside that combination the HOST BINARY decides
# (#8322, one runner and one ConPTY in every arm): a console-subsystem `node.exe`
# host starts the confined shell, while the packaged desktop's GUI-subsystem
# Electron host kills it silently — the same console rule the third family
# states, where a restricted token can inherit a console but not create one. The
# outcome is deterministic per (session mode x runner host), and the mode that
# counts is the one the session records. That advisory states the resolved mode,
# tells the model to STOP rather than retry, and hands the user the choices — a
# preset swap, a profile-patch row, or a host that owns a console (#8313); it
# never names a command to run (there is no shell to run it in) and never names
# a shell tool the failing composition does not mount. It is sent only when the
# mode the call actually ran under confines; otherwise the failure is left
# untouched and the host log says so once (silence alone would read as "the
# sandbox is not the cause", which this plugin cannot claim). The blocking half
# above deliberately does NOT cover this family: its remedy is a patch-layer
# change the user makes between sessions, not a command that repairs the
# running one.
#
# A THIRD family is recognized from a value, not from text (#7876, #7877,
# #8193, #8208, #8313):
#
#   [exit code: -1073741502]        (0xC0000142 STATUS_DLL_INIT_FAILED)
#
# A confined Windows child died while its native images were loading, i.e.
# before its entry point. It reaches the tool result as an ordinary nonzero
# exit code — upstream's runner-failure rules admit only exit 127 with the
# `windows-acl-run: ` signature, so this code is never reclassified and never
# arrives as an error — which is why a plugin reading only error results is
# structurally blind to it, and why the model retries a command that cannot
# start. The read is the shell tool's own canonical value
# (`ToolExecutionSuccess.value`, `kind: 'foreground'`), so no line of rendered
# text can be mistaken for it. The advisory states the resolved mode, says the
# process never reached its entry point, enumerates the measured producers
# (an MSYS2 / Git-Bash program that cannot create its signal pipe under the
# restricted token; the sandbox runner hosted by a GUI-subsystem Electron binary
# or spawned without a console), carries the one conversion the model can make
# itself (rewrite the work as PowerShell or `cmd`), names the remedy #8193
# measured — a real node.exe host, which the desktop ships — and says plainly
# which producers it does not know. Like the second family, it is mode-gated.
#
# A FOURTH family is the other half of the FIRST one's backend (#423). There the
# grant could not be applied at all; here it WAS applied — on the workspace root,
# once — and Windows ACE inheritance silently skipped the objects whose DACL the
# caller could not write, so commands writing into a subdirectory created or moved
# in from outside (an installer, an editor, another harness under its own account)
# are denied forever while the same command against a directory the harness itself
# created succeeds. The backend's provisioning check short-circuits on the root
# (`hasExactGrant` returns early once the root carries the ACE), so those
# descendants are never revisited. It is read from a value rather than from text,
# like the third family and for the same reason (a denial exits nonzero and the
# shipped shell tools report that as a finished run), but it needs no bespoke code:
# the executors stamp the denial onto the value as
#
#   sandbox: { mode: "workspace-write", denied: true }
#
# produced by matching the backend's own refusal dialect in the captured stderr —
# so this plugin reads the harness's own reading of its own sandbox. It speaks
# only when the host is Windows, the stamped mode is `workspace-write`, and EVERY
# absolute path the command names lies inside the session's workspace: a denial
# anywhere else (outside the workspace, under `read-only`, a runner failure) is
# the sandbox working as designed and is left alone. The advisory prints the path
# it keyed on beside the root it tested it against, says that retrying is provably
# useless, gives the DISCRIMINATOR — reading/listing use the normal token while
# writing/deleting use the restricted one, and both sides must pass, so an object
# whose DACL names only Administrators/SYSTEM plus the capability SID looks granted
# to a check that just greps for the SID — names the second measured variant of
# the same shape (the coverage missing on the mandatory-integrity LABEL rather
# than on the DACL, separated from outside a session by the repository's own
# `diagnose-windows-sandbox-acl`), and states the Windows ceiling that closes the
# obvious repair (a recursive `icacls /grant` for a capability SID is refused with
# ERROR_NONE_MAPPED (1332), because that SID has no name to map). It ships NO
# repair command, for the reason the standing-grant section ships none: this
# project has no Windows host to verify a line on.

- insert:
    - id: sandbox-grant-advisor
      name: '@argszero/cordis-plugin-sandbox-grant-advisor'
